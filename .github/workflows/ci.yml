name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

  docker-build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ai-review-agent:ci .

      - name: Verify healthcheck endpoint starts
        run: |
          docker run -d --name agent -p 8000:8000 \
            -e GITHUB_APP_ID=0 \
            -e WEBHOOK_SECRET=test \
            -e AWS_BEARER_TOKEN_BEDROCK=ABSKZm9vOmJhcg== \
            ai-review-agent:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null 2>&1; then
              echo "server up"; docker logs agent | tail -5; exit 0
            fi
            sleep 2
          done
          docker logs agent
          exit 1
